# Tauri frontend scaffold (build after rustup install)
# Until Rust is installed, use run_ate_app.bat (Edge/browser + Python worker).

[package]
name = "opa-ate"
version = "0.1.0"
description = "OPA ATE liquid-glass operator shell"
authors = ["Eugene Lab"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
