# RS1G02 NOR-2 -- UNCONFIRMED Path B bind. Numbers HOLD. No Datasheet CONFIRM.
# TTL-style VIH/VIL (not G08 CMOS). JH DM unlock != Datasheet CONFIRM. SOOT DRAFT.

part: RS1G02
model: RS1G02
component: Logic
package: SOT23
version: Version_1
sample_size: 4
year: "2026"
part_key: rs1g02
product_class: logic
vcc: 5.0
current_limit: 0.05
timing:
  timeout_s: 4.0
  settle_s: 0.3
enabled_tests:
  - tp
  - supply_current
  - input_threshold
  - icc
  - ii
fixture_modes:
  LOGIC:
    label: "Logic board (RS1G02 NOR)"
    board_class: general
    checklist:
      - "RS1G02 NOR-2. UNCONFIRMED DRAFT. Unsigned VIH/VIL/VOH/VOL HOLD."
      - "TTL-style VIH/VIL -- do not copy G08 CMOS 0.65/0.15 bands."
      - "oe none. IOZ OFF. ICCT ABSENT. Do not tick voh/vol until CONFIRMED loads."
    tests: [tp, supply_current, input_threshold, icc, ii]

product_model:
  part: RS1G02
  status: UNCONFIRMED
  source_card: ON_DISK_DRAFT
  confirm_note: "SOOT: JH DM unlock != Datasheet CONFIRM. Stay UNCONFIRMED DRAFT. TTL kind lock. Numbers HOLD."
  package: SC70-5
  product_class: gate_nor2
  schmitt: false
  oe: none
  output_pin: Y
  output_type: push_pull
  logic_inputs:
  - A
  - B
  pins:
  - {name: A, role: input}
  - {name: B, role: input}
  - {name: GND, role: gnd}
  - {name: Y, role: output}
  - {name: VCC, role: vcc}
  pin_drive:
    A: {src: awg, ch: 1}
    B: {src: awg, ch: 2}
  truth_table:
    status: UNCONFIRMED
    kind: combinational
    note: NOR Y=NOT(A OR B). Function bind from on-disk DRAFT card. Not Datasheet-signed.
    rows:
    - {A: L, B: L, Y: H}
    - {A: H, B: L, Y: L}
    - {A: L, B: H, Y: L}
    - {A: H, B: H, Y: L}
  isolation:
    status: UNCONFIRMED
    note: NOR other=L -> invert. Do not copy G32 OR track.
    tests:
      A:
      - {sweep_pin: A, fix: {B: L}, y_expect: invert}
      B:
      - {sweep_pin: B, fix: {A: L}, y_expect: invert}
  vcc_grid:
    status: UNCONFIRMED
    stimulus: AWG
    kind: TTL
    note: TTL-style VIH/VIL (not G08 CMOS 0.65*VCC / 0.15*VCC). Band numbers HOLD.
    ranges: []
    fixed_points: []
  pass_mode:
    icc: max_only
    voh: min_only
    vol: max_only
  dc_limits:
    VOH:
      status: UNCONFIRMED
      note: do not invent loads
    VOL:
      status: UNCONFIRMED
      note: do not invent loads
    ICCT_uA:
      status: ABSENT
      note: do not invent ICCT
    delta_icc_uA:
      status: UNCONFIRMED
      note: Numbers HOLD. delta_icc from this block only; ICCT ABSENT is not a map
  recipe:
    settle_s: 0.05
    stable_n: 3
    stable_eps_V: 0.005
    stable_eps_A: null
    settle_timeout_s: 2.0
    runner: gate_nor2
    dual_channel_continue: false
  gaps:
  - UNCONFIRMED DRAFT; unsigned vcc_grid / VOH / VOL / delta_icc HOLD
  - NOR other=L invert; oe none; IOZ OFF
  - TTL-style VIH/VIL -- do not copy G08 CMOS bands
  - ICCT ABSENT -- do not invent ICCT map; delta_icc_uA only
  - do not invent VOH/VOL / ICCT / VIH/VIL numbers
  - stable_eps_A null
  data_paths:
    excel: "#Test_Database/{Component}/{Part}/{Package}/{Operator}/{Version_N}/workbook/"
    report: sessions/report.json
    datalog: sessions/datalog.md
    csv: sessions/csv/
    report_pdf: report.pdf
    records: "{test}/DUT_n/records/"
    attach: "{test}/DUT_n/"
  workbook_policy:
    golden_auto: one_per_version_overwrite
    auto: one_per_version_overwrite
    ultimate_manual: never_auto_write
    pretty: never_auto_write
  excel_plots:
    status: UNCONFIRMED
    series:
      - vih_vs_vcc
      - vil_vs_vcc
      - icc_vs_vcc
      - ii_vs_vcc
