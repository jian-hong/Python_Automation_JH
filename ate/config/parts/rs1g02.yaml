    A: {src: awg, ch: 1}
    B: {src: awg, ch: 2}
  truth_table:
    status: UNCONFIRMED
    kind: combinational
    note: NOR Y=NOT(A OR B). Function lock only. Numbers HOLD.
    rows:
    - {A: L, B: L, Y: H}
    - {A: H, B: L, Y: L}
    - {A: L, B: H, Y: L}
    - {A: H, B: H, Y: L}
  isolation:
    status: UNCONFIRMED
    note: NOR other=L -> invert. Do not copy G32 OR track.
    tests:
      A:
      - {sweep_pin: A, fix: {B: L}, y_expect: invert}
      B:
      - {sweep_pin: B, fix: {A: L}, y_expect: invert}
  vcc_grid:
    status: UNCONFIRMED
    stimulus: AWG
    kind: TTL
    note: TTL-style VIH/VIL (not G08 CMOS 0.65*VCC / 0.15*VCC). Numbers HOLD.
