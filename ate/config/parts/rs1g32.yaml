# Path B DRAFT -- UNCONFIRMED. OR-2 Y=A+B; isolation other=L.
product_model:
  part: RS1G32
  status: UNCONFIRMED
  source_card: RS1G32_card_DRAFT.md
  package: SC70-5
  schmitt: false
  oe: none
  output_type: push_pull
  output_pin: Y
  vcc_op_min: 1.65
  vcc_op_max: 5.5
  logic_inputs: [A, B]
  pins:
    - {name: A, role: input, number: 1}
    - {name: B, role: input, number: 2}
    - {name: GND, role: gnd, number: 3}
    - {name: Y, role: output, number: 4}
    - {name: VCC, role: vcc, number: 5}
  truth_table:
    status: UNCONFIRMED
    rows:
      - {A: H, B: H, Y: H}
      - {A: L, B: H, Y: H}
      - {A: H, B: L, Y: H}
      - {A: L, B: L, Y: L}
  isolation:
    status: UNCONFIRMED
    tests:
      A:
        - {sweep_pin: A, fix: {B: L}, y_expect: track}
      B:
        - {sweep_pin: B, fix: {A: L}, y_expect: track}
  vcc_grid:
    status: UNCONFIRMED
    stimulus: PSU_MSO
    pass_mode: {VIH: min_only, VIL: max_only}
    ranges:
      - {start: 1.65, stop: 1.95, step: 0.1, VIH_min: "0.65*VCC", VIL_max: "0.15*VCC"}
      - {start: 2.3, stop: 2.7, step: 0.1, VIH_min_V: 1.7, VIL_max_V: 0.3}
      - {start: 3.0, stop: 3.6, step: 0.1, VIH_min_V: 2.2, VIL_max_V: 0.4}
      - {start: 4.5, stop: 5.5, step: 0.1, VIH_min: "0.7*VCC", VIL_max: "0.15*VCC"}
    fixed_points: []
  pass_mode: {VIH: min_only, VIL: max_only, voh: min_only, vol: max_only, icc: max_only, delta_icc: max_only, ii: max_only}
  dc_limits:
    VOH:
      status: UNCONFIRMED
      loads:
        - {IOH_mA: -0.1, vcc: [1.65, 5.5], VOH_min: "VCC-0.1"}
        - {IOH_mA: -4, vcc: 1.65, VOH_min_V: 1.2}
        - {IOH_mA: -8, vcc: 2.3, VOH_min_V: 1.9}
        - {IOH_mA: -16, vcc: 3.0, VOH_min_V: 2.4}
        - {IOH_mA: -24, vcc: 3.0, VOH_min_V: 2.3}
        - {IOH_mA: -32, vcc: 4.5, VOH_min_V: 3.8}
    VOL:
      status: UNCONFIRMED
      loads:
        - {IOL_mA: 0.1, vcc: [1.65, 5.5], VOL_max_V: 0.1}
        - {IOL_mA: 4, vcc: 1.65, VOL_max_V: 0.45}
        - {IOL_mA: 8, vcc: 2.3, VOL_max_V: 0.3}
        - {IOL_mA: 16, vcc: 3.0, VOL_max_V: 0.4}
        - {IOL_mA: 24, vcc: 3.0, VOL_max_V: 0.55}
        - {IOL_mA: 32, vcc: 4.5, VOL_max_V: 0.55}
    II_uA: {Full: 5.0}
    ICC_uA: {Full: 10.0}
    ICCT_uA: {status: UNCONFIRMED, Full: 500.0, vcc_min: 3.0, offset_v: 0.6, map_to: delta_icc}
  recipe:
    settle_s: 0.05
    stable_n: 3
    stable_eps_V: 0.005
    stable_eps_A: null
    settle_timeout_s: 2.0
    icc_corners: 4
    search:
      status: PROPOSED_FROM_LIVE
      vih: {arm: 0.0, direction: up, no_reverse_in_stage: true}
      vil: {arm: VCC, direction: down, no_reverse_in_stage: true}
      step_ladder_V: [0.5, 0.2, 0.1, 0.05, 0.01]
      on_hit: {skip_rest_of_walk: true, rearm: true, restart_fraction_back: 0.3, next_smaller_step: true}
      after_precision: {interpolate: true, skip_to: next_test_or_vcc}
      coverage_order: [input_threshold, icc, ii, voh, vol, delta_icc]
  enabled_tests_model: [input_threshold, icc, ii, voh, vol, delta_icc]
  gaps: ["UNCONFIRMED", "IOZ OFF"]



