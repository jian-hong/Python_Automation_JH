product_model:
  part: RS2G32
  status: UNCONFIRMED
  package: VSSOP8
  product_class: dual_or2
  schmitt: false
  oe: none
  output_pin: Y
  output_type: push_pull
  logic_inputs:
  - A
  - B
  pins:
  - {name: A, role: input}
  - {name: B, role: input}
  - {name: GND, role: gnd}
  - {name: Y, role: output}
  - {name: VCC, role: vcc}
  pin_drive:
    A: {src: awg, ch: 1}
    B: {src: awg, ch: 2}
  truth_table:
    status: UNCONFIRMED
    kind: combinational
    note: OR Y=A OR B per channel. Pin numbers HOLD.
    rows:
    - {A: H, B: H, Y: H}
    - {A: L, B: H, Y: H}
    - {A: H, B: L, Y: H}
    - {A: L, B: L, Y: L}
  isolation:
    status: UNCONFIRMED
    note: OR other=L -> track. CHA then CHB.
    tests:
      A:
      - {sweep_pin: A, fix: {B: L}, y_expect: track}
      B:
      - {sweep_pin: B, fix: {A: L}, y_expect: track}
  vcc_grid:
    status: UNCONFIRMED
    stimulus: AWG
    note: Numbers HOLD. Do not copy G08 CMOS bands.
    ranges: []
    fixed_points: []
  pass_mode:
    icc: max_only
    voh: min_only
    vol: max_only
  dc_limits:
    VOH:
      status: UNCONFIRMED
      note: do not invent loads
    VOL:
      status: UNCONFIRMED
      note: do not invent loads
    ICCT_uA:
      status: ABSENT
      note: do not invent ICCT
    delta_icc_uA:
      status: UNCONFIRMED
      note: Numbers HOLD. delta_icc from this block only; ICCT ABSENT is not a map
  recipe:
    settle_s: 0.05
    stable_n: 3
    stable_eps_V: 0.005
    stable_eps_A: null
    settle_timeout_s: 2.0
    runner: dual_or2
    dual_channel_continue: true
    channels: [CHA, CHB]
  gaps:
  - UNCONFIRMED -- numbers HOLD; Datasheet CONFIRM needed
  - dual OR; CHA then CHB Continue; oe none; IOZ OFF
  - pin numbers HOLD -- do not invent 8-pin map
  - ICCT ABSENT -- do not invent ICCT map; delta_icc_uA only
  - do not invent VOH/VOL / ICCT / VIH/VIL
  - stable_eps_A null
