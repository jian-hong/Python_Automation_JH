# RS2G32 dual OR-2 -- UNCONFIRMED Path B bind. Numbers HOLD. No CONFIRM.
# dual_channel_continue CHA then CHB. No OE/IOZ invent.

part: RS2G32
model: RS2G32
component: Logic
package: VSSOP8
version: Version_1
sample_size: 4
year: "2026"
part_key: rs2g32
product_class: logic
vcc: 5.0
current_limit: 0.05
timing:
  timeout_s: 4.0
  settle_s: 0.3
enabled_tests:
  - tp
  - supply_current
fixture_modes:
  LOGIC:
    label: "Logic board (RS2G32 dual OR)"
    board_class: general
    checklist:
      - "RS2G32 dual OR. UNCONFIRMED -- numbers HOLD."
      - "CHA then CHB Continue. oe none. Do not invent IOZ."
