# RS2G00 dual NAND-2 -- GT-wave 2026-09-21. Function CONFIRMED.
# CHA then CHB Continue. Unsigned vcc_grid / VOH / VOL HOLD. Pin numbers HOLD. No invent OE/IOZ.

part: RS2G00
model: RS2G00
component: Logic
package: VSSOP8
version: Version_1
sample_size: 4
year: "2026"
part_key: rs2g00
product_class: logic
vcc: 5.0
current_limit: 0.05
timing:
  timeout_s: 4.0
  settle_s: 0.3
enabled_tests:
  - tp
  - supply_current
  - input_threshold
  - icc
  - ii
fixture_modes:
  LOGIC:
    label: "Logic board (RS2G00 dual NAND)"
    board_class: general
    checklist:
      - "RS2G00 dual NAND. CONFIRMED function 2026-09-21. CHA then CHB Continue."
      - "oe none. Do not invent IOZ. Unsigned VIH/VIL/VOH/VOL HOLD. Pin numbers HOLD."
      - "Do not tick voh/vol until CONFIRMED loads. ICCT ABSENT."
    tests: [tp, supply_current, input_threshold, icc, ii]

product_model:
  part: RS2G00
  status: CONFIRMED
  source_card: RS2G00_card_CONFIRMED.md
  confirm_note: "GT-wave 2026-09-21. Dual NAND function CONFIRMED. CHA then CHB. Unsigned numbers HOLD. excel_plots UNCONFIRMED."
  package: VSSOP8
  product_class: dual_nand2
  schmitt: false
  oe: none
  output_pin: Y
  output_type: push_pull
  logic_inputs:
  - A
  - B
  pins:
  - {name: A, role: input}
  - {name: B, role: input}
  - {name: GND, role: gnd}
  - {name: Y, role: output}
  - {name: VCC, role: vcc}
  pin_drive:
    A: {src: awg, ch: 1}
    B: {src: awg, ch: 2}
  truth_table:
    status: CONFIRMED
    kind: combinational
    note: NAND Y=NOT(A AND B) per channel. Pin numbers HOLD. Function CONFIRMED (GT-wave).
    rows:
    - {A: H, B: H, Y: L}
    - {A: L, B: H, Y: H}
    - {A: H, B: L, Y: H}
    - {A: L, B: L, Y: H}
  isolation:
    status: CONFIRMED
    note: NAND other=H invert. CHA then CHB.
    tests:
      A:
      - {sweep_pin: A, fix: {B: H}, y_expect: invert}
      B:
      - {sweep_pin: B, fix: {A: H}, y_expect: invert}
  vcc_grid:
    status: UNCONFIRMED
    stimulus: AWG
    note: No card VIH/VIL bands. Do not copy G08 CMOS. Numbers HOLD.
    ranges: []
    fixed_points: []
  pass_mode:
    icc: max_only
    voh: min_only
    vol: max_only
  dc_limits:
    VOH:
      status: UNCONFIRMED
      note: do not invent loads
    VOL:
      status: UNCONFIRMED
      note: do not invent loads
    ICCT_uA:
      status: ABSENT
      note: do not invent ICCT
    delta_icc_uA:
      status: UNCONFIRMED
      note: Numbers HOLD. ICCT ABSENT is not a map
  recipe:
    settle_s: 0.05
    stable_n: 3
    stable_eps_V: 0.005
    stable_eps_A: null
    settle_timeout_s: 2.0
    runner: dual_nand2
    dual_channel_continue: true
    channels: [CHA, CHB]
  gaps:
  - CONFIRMED dual NAND; CHA then CHB Continue; unsigned loads HOLD; excel_plots UNCONFIRMED
  - oe none; IOZ OFF; pin numbers HOLD
  - ICCT ABSENT -- do not invent ICCT
  - stable_eps_A null
  data_paths:
    excel: "#Test_Database/{Component}/{Part}/{Package}/{Operator}/{Version_N}/workbook/"
    report: sessions/report.json
    datalog: sessions/datalog.md
    csv: sessions/csv/
    report_pdf: report.pdf
    records: "{test}/DUT_n/records/"
    attach: "{test}/DUT_n/"
  workbook_policy:
    golden_auto: one_per_version_overwrite
    auto: one_per_version_overwrite
    ultimate_manual: never_auto_write
    pretty: never_auto_write
  excel_plots:
    status: UNCONFIRMED
    series:
      - vih_vs_vcc
      - vil_vs_vcc
      - icc_vs_vcc
      - ii_vs_vcc
