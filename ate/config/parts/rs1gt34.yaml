  pins:
    - {name: NC, role: nc, number: 1}
    - {name: A, role: input, number: 2}
    - {name: GND, role: gnd, number: 3}
    - {name: Y, role: output, number: 4}
    - {name: VCC, role: vcc, number: 5}
  pin_drive:
    A: {src: psu, ch: 3}
    VCC: {src: psu, ch: 1}
  vcc_grid:
    status: CONFIRMED
    stimulus: PSU_MSO
    pass_mode: {VIH: min_only, VIL: max_only}
    fixed_points:
      - {vcc: 2.0, VIH_min_V: 1.0, VIL_max_V: 0.3}
      - {vcc: 3.3, VIH_min_V: 1.5, VIL_max_V: 0.55}
    ranges:
      - {start: 4.5, stop: 5.5, step: 0.1, VIH_min_V: 2.0, VIL_max_V: 0.8, label: "4.5-5.5 band"}
  recipe:
    threshold_step_v: 0.05
    settle_s: 0.05
    stable_n: 3
    stable_eps_V: 0.005
    stable_eps_A: null  # current settle: null = NON_TIGHT; do not invent uA
    settle_timeout_s: 2.0
    icc_corners: 2  # 2^1
    # recipe.delta_offset_v omitted -- ICCT is 500uA @5.5 one_in@3.4, not VCC-0.6
    search:
      status: PROPOSED_FROM_LIVE
      vih: {arm: 0.0, direction: up, no_reverse_in_stage: true}
      vil: {arm: VCC, direction: down, no_reverse_in_stage: true}
      step_ladder_V: [0.5, 0.2, 0.1, 0.05, 0.01]
      step_select: "largest step compatible with card |limit|"
      on_hit: {skip_rest_of_walk: true, rearm: true, restart_fraction_back: 0.3, next_smaller_step: true}
      after_precision: {interpolate: true, skip_to: next_test_or_vcc}
      coverage_order: [input_threshold, icc, ii, voh, vol, delta_icc]
  pass_mode:
    VIH: min_only
    VIL: max_only
    icc: max_only
    delta_icc: max_only
    ii: max_only
    voh: min_only
    vol: max_only
  limit_mode:
    VIH: min_only
    VIL: max_only
    icc: max_only
    delta_icc: max_only
    ii: max_only
    voh: min_only
    vol: max_only
  dc_limits:
    icc: {spec_id: ICC_uA, limit_mode: max_only, status: CONFIRMED, plus25C_max: 1.0, Full: 10.0}
    delta_icc: {spec_id: DELTA_ICC_uA, limit_mode: max_only, status: CONFIRMED, map_from: ICCT_uA}
    ICCT_uA:
      status: CONFIRMED
      Full: 500.0
      vcc: 5.5
      one_input_V: 3.4
      map_to: delta_icc
      pass_mode: max_only
    ii: {spec_id: II_uA, limit_mode: max_only, status: CONFIRMED, plus25C_max: 1.0, Full: 5.0}
    Ioff_uA: {plus25C_max: 1.0, Full: 10.0, note: "VCC=0; not IOZ"}
    voh: {status: CONFIRMED, note: "CONFIRMED IOH grid; PSU CH2 Y-load"}
    vol: {status: CONFIRMED, note: "CONFIRMED IOL grid; PSU CH2 Y-load"}
    input_threshold: {status: CONFIRMED, note: "VIH/VIL from vcc_grid CONFIRMED"}
  wire_map:
    source: pins+pin_drive
    status: EDITABLE
    note: "From CONFIRMED pins + pin_drive. PSU CH1=VCC. PSU CH2=Y-load (pin Y; voh/vol). PSU CH3=A. NC not wired. Do not invent AWG nets."
    psu:
      CH1: {pin: VCC, number: 5, role: vcc}
      CH2: {pin: Y, number: 4, role: output, use: load}
      CH3: {pin: A, number: 2, role: input}
    gnd: {pin: GND, number: 3, role: gnd}
    tests:
      input_threshold:
        psu: [CH1, CH3]
        dmm: Y
        scope: {CH1: {pin: Y, number: 4, role: output, use: debug}}
      icc:
        psu: [CH1, CH3]
        dmm: VCC
        scope: {CH1: {pin: Y, number: 4, role: output, use: debug}}
      delta_icc:
        psu: [CH1, CH3]
        dmm: VCC
        scope: {CH1: {pin: Y, number: 4, role: output, use: debug}}
      ii:
        psu: [CH1, CH3]
        dmm: A
        scope: {CH1: {pin: Y, number: 4, role: output, use: debug}}
      voh:
        psu: [CH1, CH2, CH3]
        dmm: Y
        scope: {CH1: {pin: Y, number: 4, role: output, use: debug}}
      vol:
