# RS1G97 Logic configurable gate -- Path B product_model.
# Lim codes in Downloads/code/RS1G97 -- not imported.
# truth_table: Datasheet §4 FUNCTION TABLE rows from local extract. UNCONFIRMED
# (not Datasheet-signed; not greenable). See Lim goldens: seelim_dc locator only.

part: RS1G97
model: RS1G97
component: Logic
device: RS1G97
package: SOT23
version: Version_1
sample_size: 4
year: "2026"
owner: lim
part_key: rs1g97
product_class: logic

vcc: 5.0
current_limit: 0.10
timing:
  timeout_s: 4.0
  settle_s: 0.3

# Path B DC ids. No ioz (oe none). No ioff (Ioff is a different datasheet
# partial-power-down param, not Path B DC). tp stays AC.
enabled_tests:
  - tp
  - input_threshold
  - vth
  - icc
  - delta_icc
  - ii
  - voh
  - vol

fixture_modes:
  LOGIC:
    label: "Logic board (RS1G97 / Path B DC)"
    board_class: general
    checklist:
      - "RS1G97 is configurable logic, not analog switch."
      - "truth_table.status=UNCONFIRMED (Datasheet §4 rows; not Datasheet-signed)."
      - "AWG CH1=A CH2=B; PSU CH1=VCC CH3=C static; CH2 is Y-load/vref for VOH/VOL/IOZ."
      - "See Lim goldens are detect-only (seelim_dc locator). Limits stay in ate/config/limits."
    tests:
      - tp
      - input_threshold
      - vth
      - icc
      - delta_icc
      - ii
      - voh
      - vol

product_model:
  part: RS1G97
  status: UNCONFIRMED
  truth_table_status: UNCONFIRMED
  isolation_status: UNCONFIRMED
  schmitt: true
  oe: none
  output_pin: Y
  vcc_op_min: 1.65  # range metadata only (datasheet recommended VCC). Not a sweep.
  vcc_op_max: 5.5
  vcc_op_status: RANGE_METADATA
  vcc_list: [5.0]  # do not expand inventively
  vcc_list_status: PROVISIONAL
  logic_inputs: [A, B, C]
  # Datasheet §7 PIN DESCRIPTION SOT23-6/SC70-6: B=1 GND=2 A=3 Y=4 VCC=5 C=6
  pins:
    - {name: B, role: input, number: 1}
    - {name: GND, role: gnd, number: 2}
    - {name: A, role: input, number: 3}
    - {name: Y, role: output, number: 4}
    - {name: VCC, role: vcc, number: 5}
    - {name: C, role: input, number: 6}
  # C on PSU CH3 so CH2 stays Y-load/vref (force/sense). PROVISIONAL fixture map.
  pin_drive:
    A: {src: awg, ch: 1}
    B: {src: awg, ch: 2}
    C: {src: psu, ch: 3}
  recipe:
    threshold_step_v: 0.05
    settle_s: 0.3
    delta_offset_v: 0.6  # datasheet dICC: one input at VCC-0.6V
    delta_vcc_min: 3.0    # datasheet dICC: 3V to 5.5V
  # Schmitt VT+/VT- = range. Not a single input_threshold:range collapse.
  pass_mode:
    VT+: range
    VT-: range
    icc: max_only
    delta_icc: max_only
    ii: max_only
    voh: min_only
    vol: max_only
  limit_mode:
    VT+: range
    VT-: range
    icc: max_only
    delta_icc: max_only
    ii: max_only
    voh: min_only
    vol: max_only
  dc_limits:
    # Numbers live in ate/config/limits/rs1g97.yaml. Do not invent IOH/IOL.
    icc: {spec_id: ICC_uA, limit_mode: max_only}
    delta_icc: {spec_id: DELTA_ICC_uA, limit_mode: max_only}
    ii: {spec_id: II_uA, limit_mode: max_only}
    voh: {status: PROVISIONAL, note: "catalog hook only; no invented IOH/IOL loads"}
    vol: {status: PROVISIONAL, note: "catalog hook only; no invented IOH/IOL loads"}
  # Datasheet §4 FUNCTION TABLE (A B C -> Y). UNCONFIRMED / not greenable.
  # LLL->L HLL->L LHL->H HHL->H LLH->L HLH->H LHH->L HHH->H
  truth_table:
    status: UNCONFIRMED
    source: "Datasheet §4 FUNCTION TABLE RUNIC RS1G97_(RevA.2.1) local extract"
    rows:
      - {A: L, B: L, C: L, Y: L}
      - {A: H, B: L, C: L, Y: L}
      - {A: L, B: H, C: L, Y: H}
      - {A: H, B: H, C: L, Y: H}
      - {A: L, B: L, C: H, Y: L}
      - {A: H, B: L, C: H, Y: H}
      - {A: L, B: H, C: H, Y: L}
      - {A: H, B: H, C: H, Y: H}
  # Isolation from this table only (unused ties). Same UNCONFIRMED status.
  isolation:
    status: UNCONFIRMED
    source: "derived from truth_table (Datasheet §4); not Datasheet-signed"
    tests:
      A:
        - {sweep_pin: A, fix: {B: L, C: H}, y_expect: track}
        - {sweep_pin: A, fix: {B: H, C: H}, y_expect: track}
      B:
        - {sweep_pin: B, fix: {A: L, C: L}, y_expect: track}
      C:
        - {sweep_pin: C, fix: {A: H, B: L}, y_expect: track}
        - {sweep_pin: C, fix: {A: L, B: H}, y_expect: invert, vil_sweep: reverse}
