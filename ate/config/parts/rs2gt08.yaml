# RS2GT08 dual TTL AND-2 -- GT-wave 2026-09-21. Function CONFIRMED.
# CHA then CHB Continue. TTL kind. Unsigned bands / VOH / VOL HOLD. No invent ICCT/OE.

part: RS2GT08
model: RS2GT08
component: Logic
package: VSSOP8
version: Version_1
sample_size: 4
year: "2026"
part_key: rs2gt08
product_class: logic
vcc: 5.0
current_limit: 0.05
timing:
  timeout_s: 4.0
  settle_s: 0.3
enabled_tests:
  - tp
  - supply_current
  - input_threshold
  - icc
  - ii
fixture_modes:
  LOGIC:
    label: "Logic board (RS2GT08 dual TTL AND)"
    board_class: general
    checklist:
      - "RS2GT08 dual TTL AND. CONFIRMED function 2026-09-21. CHA then CHB Continue."
      - "TTL-style VIH/VIL -- do not copy G08 CMOS. oe none. Do not invent IOZ/ICCT."
      - "Pin numbers HOLD. Do not tick voh/vol until CONFIRMED loads."
    tests: [tp, supply_current, input_threshold, icc, ii]

product_model:
  part: RS2GT08
  status: CONFIRMED
  source_card: RS2GT08_card_CONFIRMED.md
  confirm_note: "GT-wave 2026-09-21. Dual TTL AND function CONFIRMED. CHA then CHB. TTL kind lock. Unsigned numbers HOLD. excel_plots UNCONFIRMED."
  package: VSSOP8
  product_class: dual_and2
  schmitt: false
  oe: none
  output_pin: Y
  output_type: push_pull
  logic_inputs:
  - A
  - B
  pins:
  - {name: A, role: input}
  - {name: B, role: input}
  - {name: GND, role: gnd}
  - {name: Y, role: output}
  - {name: VCC, role: vcc}
  pin_drive:
    A: {src: awg, ch: 1}
    B: {src: awg, ch: 2}
  truth_table:
    status: CONFIRMED
    kind: combinational
    note: TTL AND Y=A AND B per channel. Pin numbers HOLD. Function CONFIRMED (GT-wave).
    rows:
    - {A: H, B: H, Y: H}
    - {A: L, B: H, Y: L}
    - {A: H, B: L, Y: L}
    - {A: L, B: L, Y: L}
  isolation:
    status: CONFIRMED
    note: AND other=H -> track. CHA then CHB.
    tests:
      A:
      - {sweep_pin: A, fix: {B: H}, y_expect: track}
      B:
      - {sweep_pin: B, fix: {A: H}, y_expect: track}
  vcc_grid:
    status: UNCONFIRMED
    stimulus: AWG
    kind: TTL
    note: TTL-style VIH/VIL (not G08 CMOS 0.65*VCC / 0.15*VCC). Band numbers HOLD.
    ranges: []
    fixed_points: []
  pass_mode:
    icc: max_only
    voh: min_only
    vol: max_only
  dc_limits:
    VOH:
      status: UNCONFIRMED
      note: do not invent loads
    VOL:
      status: UNCONFIRMED
      note: do not invent loads
    ICCT_uA:
      status: ABSENT
      note: do not invent ICCT / do not invent 0.6
    delta_icc_uA:
      status: UNCONFIRMED
      note: Numbers HOLD. ICCT ABSENT is not a map
  recipe:
    settle_s: 0.05
    stable_n: 3
    stable_eps_V: 0.005
    stable_eps_A: null
    settle_timeout_s: 2.0
    runner: dual_and2
    dual_channel_continue: true
    channels: [CHA, CHB]
  gaps:
  - CONFIRMED dual TTL AND; CHA then CHB Continue; unsigned loads HOLD; excel_plots UNCONFIRMED
  - TTL kind -- do not copy G08 CMOS; oe none; IOZ OFF; ICCT ABSENT
  - pin numbers HOLD
  - stable_eps_A null
  data_paths:
    excel: "#Test_Database/{Component}/{Part}/{Package}/{Operator}/{Version_N}/workbook/"
    report: sessions/report.json
    datalog: sessions/datalog.md
    csv: sessions/csv/
    report_pdf: report.pdf
    records: "{test}/DUT_n/records/"
    attach: "{test}/DUT_n/"
  workbook_policy:
    golden_auto: one_per_version_overwrite
    auto: one_per_version_overwrite
    ultimate_manual: never_auto_write
    pretty: never_auto_write
  excel_plots:
    status: UNCONFIRMED
    series:
      - vih_vs_vcc
      - vil_vs_vcc
      - icc_vs_vcc
      - ii_vs_vcc
