# CONFIRMED VOH/VOL Full load grid (same table as RS1G97). Jian Hong 2026-09-17.
# 100uA @1.65-5.5 expanded onto CONFIRMED vcc_list only. VOH min = VCC-0.1.
# PSU CH2 is Y-load: VOH sink rail 0V; VOL source rail = VCC. Not datasheet Vref.
voh_table:
  - {id: VOH_1p65V_100uA, vcc: 1.65, ioh_a: -0.0001, spec_min: 1.55}
  - {id: VOH_2p3V_100uA, vcc: 2.3, ioh_a: -0.0001, spec_min: 2.2}
  - {id: VOH_3p0V_100uA, vcc: 3.0, ioh_a: -0.0001, spec_min: 2.9}
  - {id: VOH_4p5V_100uA, vcc: 4.5, ioh_a: -0.0001, spec_min: 4.4}
  - {id: VOH_5p5V_100uA, vcc: 5.5, ioh_a: -0.0001, spec_min: 5.4}
  - {id: VOH_1p65V_4mA, vcc: 1.65, ioh_a: -0.004, spec_min: 1.2}
  - {id: VOH_2p3V_8mA, vcc: 2.3, ioh_a: -0.008, spec_min: 1.9}
  - {id: VOH_3p0V_16mA, vcc: 3.0, ioh_a: -0.016, spec_min: 2.4}
  - {id: VOH_3p0V_24mA, vcc: 3.0, ioh_a: -0.024, spec_min: 2.3}
  - {id: VOH_4p5V_32mA, vcc: 4.5, ioh_a: -0.032, spec_min: 3.8}
