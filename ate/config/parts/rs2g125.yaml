# RS2G125 dual 3-state buffer -- GT-wave 2026-09-21. Function CONFIRMED.
# OE active-L. IOZ ON when OE inactive H @3.6V UNSURE. CHA then CHB. Do not invent IOZ uA / VOH/VOL.

part: RS2G125
model: RS2G125
component: Logic
package: VSSOP8
version: Version_1
sample_size: 4
year: "2026"
part_key: rs2g125
product_class: logic
vcc: 5.0
current_limit: 0.05
timing:
  timeout_s: 4.0
  settle_s: 0.3
enabled_tests:
  - tp
  - supply_current
  - input_threshold
  - icc
  - ii
  - ioz
fixture_modes:
  LOGIC:
    label: "Logic board (RS2G125 dual buf OE)"
    board_class: general
    checklist:
      - "RS2G125 dual 3-state buffer. CONFIRMED function 2026-09-21. CHA then CHB Continue."
      - "OE active L. IOZ when OE inactive H only. IOZ @3.6V UNSURE -- do not invent uA."
      - "Pin numbers HOLD. Do not tick voh/vol until CONFIRMED loads. Do not invent ICCT."
    tests: [tp, supply_current, input_threshold, icc, ii, ioz]

product_model:
  part: RS2G125
  status: CONFIRMED
  source_card: RS2G125_card_CONFIRMED.md
  confirm_note: "GT-wave 2026-09-21. Dual buf OE-L CONFIRMED. IOZ ON @3.6V UNSURE (no invent uA). CHA then CHB. Unsigned VOH/VOL HOLD. excel_plots UNCONFIRMED."
  package: VSSOP8
  product_class: dual_buf
  schmitt: false
  oe:
    pin: OE
    active: low
  output_pin: Y
  output_type: three_state
  logic_inputs:
  - A
  pins:
  - {name: OE, role: oe, note: "OE active L"}
  - {name: A, role: input}
  - {name: GND, role: gnd}
  - {name: Y, role: output}
  - {name: VCC, role: vcc}
  pin_drive:
    A: {src: awg, ch: 1}
    OE: {src: awg, ch: 2}
  truth_table:
    status: CONFIRMED
    kind: combinational
    note: Dual buf per channel. OE L passes A; OE H -> Y=Z. Pin numbers HOLD.
    rows:
    - {OE: L, A: H, Y: H}
    - {OE: L, A: L, Y: L}
    - {OE: H, A: X, Y: Z}
  isolation:
    status: CONFIRMED
    note: Buffer track while OE active L. CHA then CHB.
    tests:
      A:
      - {sweep_pin: A, fix: {OE: L}, y_expect: track}
  vcc_grid:
    status: UNCONFIRMED
    stimulus: AWG
    note: No card VIH/VIL bands. Do not copy G125 VIL 0.3*VCC. Numbers HOLD.
    ranges: []
    fixed_points: []
  pass_mode:
    icc: max_only
    ioz: max_only
    voh: min_only
    vol: max_only
  dc_limits:
    VOH:
      status: UNCONFIRMED
      note: do not invent loads
    VOL:
      status: UNCONFIRMED
      note: do not invent loads
    IOZ_uA:
      status: UNSURE
      at_vcc: 3.6
      note: IOZ ON @3.6V when OE inactive H. uA Full HOLD -- do not invent / do not copy G125 10uA
    ICCT_uA:
      status: ABSENT
      note: do not invent ICCT
    delta_icc_uA:
      status: UNCONFIRMED
      note: Numbers HOLD. ICCT ABSENT is not a map
  recipe:
    settle_s: 0.05
    stable_n: 3
    stable_eps_V: 0.005
    stable_eps_A: null
    settle_timeout_s: 2.0
    runner: dual_buf
    dual_channel_continue: true
    channels: [CHA, CHB]
    ioz_when: oe_inactive
    ioz_vcc_list: [3.6]
  gaps:
  - CONFIRMED dual buf OE-L; IOZ ON @3.6V UNSURE; CHA then CHB; unsigned VOH/VOL HOLD
  - do not invent IOZ uA / ICCT / pin numbers / G125 VIL 0.3*VCC
  - excel_plots UNCONFIRMED
  - stable_eps_A null
  data_paths:
    excel: "#Test_Database/{Component}/{Part}/{Package}/{Operator}/{Version_N}/workbook/"
    report: sessions/report.json
    datalog: sessions/datalog.md
    csv: sessions/csv/
    report_pdf: report.pdf
    records: "{test}/DUT_n/records/"
    attach: "{test}/DUT_n/"
  workbook_policy:
    golden_auto: one_per_version_overwrite
    auto: one_per_version_overwrite
    ultimate_manual: never_auto_write
    pretty: never_auto_write
  excel_plots:
    status: UNCONFIRMED
    series:
      - vih_vs_vcc
      - vil_vs_vcc
      - icc_vs_vcc
      - ii_vs_vcc
      - ioz_vs_vcc
