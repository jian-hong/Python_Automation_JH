# No ioz (oe none).
enabled_tests:
  - tp
  - tidle
  - tdis
  - delta_supply_current
  - off_current
  - input_thresholds
  - ioff_leakage
  - input_leakage_sweep
  - supply_current_sweep
  - vih_vil
  - voh_load
  - vol_load
  - input_threshold
  - icc
  - delta_icc
  - ii
  - voh
  - vol

fixture_modes:
  LOGIC:
    label: "Logic board (RS1G08 / Ariff)"
    board_class: general
    checklist:
      - "Logic fixture for RS1G08 (Ariff)"
      - "PSU CH1 = VCC; AWG for input stimulus on DC sweeps"
      - "VOH/VOL need PSU CH2=Vref CH3=V+ and DMM"
      - "DMM required for all DC / leakage / threshold rows"
    tests:
      - tp
      - tidle
      - tdis
      - delta_supply_current
      - off_current
      - input_thresholds
      - ioff_leakage
      - input_leakage_sweep
      - supply_current_sweep
      - vih_vil
      - voh_load
      - vol_load
      - input_threshold
      - icc
      - delta_icc
      - ii
      - voh
      - vol

# Path B DRAFT product_model -- UNCONFIRMED, no number unlock. Keep AWG pin_drive.
# Campaign package stays SOT23. No excel_plots (sheet_map paste.values).
product_model:
  part: RS1G08
  status: UNCONFIRMED
  source_card: RS1G08_card_DRAFT.md
  package: SC70-5
  packages_note: "SOT23-5 / SC70-5 / XDFN -- do not merge SKUs; campaign package stays SOT23"
  schmitt: false
  oe: none
  output_pin: Y
  output_type: push_pull
  vcc_op_min: 1.65
  vcc_op_max: 5.5
  logic_inputs: [A, B]
  pins:
    - {name: A, role: input, number: 1}
    - {name: B, role: input, number: 2}
    - {name: GND, role: gnd, number: 3}
    - {name: Y, role: output, number: 4}
    - {name: VCC, role: vcc, number: 5}
  pin_drive:
    A: {src: awg, ch: 1}
    B: {src: awg, ch: 2}
  truth_table:
    status: UNCONFIRMED
    source: "RS1G08 RevA.6.2 §4 Y=A·B"
    rows:
      - {A: H, B: H, Y: H}
      - {A: L, B: H, Y: L}
      - {A: H, B: L, Y: L}
      - {A: L, B: L, Y: L}
  isolation:
    status: UNCONFIRMED
    tests:
      A:
        - {sweep_pin: A, fix: {B: H}, y_expect: track}
      B:
        - {sweep_pin: B, fix: {A: H}, y_expect: track}
  vcc_grid:
    status: UNCONFIRMED
    stimulus: PSU_MSO
    pass_mode: {VIH: min_only, VIL: max_only}
    ranges:
      - {start: 1.65, stop: 1.95, step: 0.1, VIH_min: "0.65*VCC", VIL_max: "0.15*VCC", label: "1.65-1.95"}
      - {start: 2.3, stop: 2.7, step: 0.1, VIH_min_V: 1.7, VIL_max_V: 0.3, label: "2.3-2.7"}
      - {start: 3.0, stop: 3.6, step: 0.1, VIH_min_V: 2.2, VIL_max_V: 0.4, label: "3-3.6"}
      - {start: 4.5, stop: 5.5, step: 0.1, VIH_min: "0.7*VCC", VIL_max: "0.15*VCC", label: "4.5-5.5"}
    fixed_points: []
  pass_mode:
    VIH: min_only
    VIL: max_only
    voh: min_only
    vol: max_only
    icc: max_only
    delta_icc: max_only
    ii: max_only
  limit_mode:
    VIH: min_only
    VIL: max_only
    icc: max_only
    delta_icc: max_only
    ii: max_only
    voh: min_only
    vol: max_only
  dc_limits:
    VOH:
      status: UNCONFIRMED
      note: "extract 9.2; light-load IOH current and IOH -24mA VCC glyph-missing -- omitted"
      loads:
        - {IOH_mA: -4, vcc: 1.65, VOH_min_V: 1.2}
        - {IOH_mA: -8, vcc: 2.3, VOH_min_V: 1.9}
        - {IOH_mA: -16, vcc: 3.0, VOH_min_V: 2.4}
        - {IOH_mA: -32, vcc: 4.5, VOH_min_V: 3.8}
    VOL:
      status: UNCONFIRMED
      note: "extract 9.2; light-load 100uA and IOL 24mA VCC glyph-missing -- omitted"
      loads:
        - {IOL_mA: 4, vcc: 1.65, VOL_max_V: 0.45}
        - {IOL_mA: 8, vcc: 2.3, VOL_max_V: 0.3}
        - {IOL_mA: 16, vcc: 3.0, VOL_max_V: 0.4}
        - {IOL_mA: 32, vcc: 4.5, VOL_max_V: 0.55}
    II_uA: {plus25C_max: 1.0, Full: 5.0}
    ICC_uA: {plus25C_max: 1.0, Full: 10.0}
    ICCT_uA:
      status: UNCONFIRMED
      Full: 500.0
      vcc_min: 3.0
      offset_v: 0.6
      map_to: delta_icc
  recipe:
    settle_s: 0.05
    stable_n: 3
    stable_eps_V: 0.005
    stable_eps_A: null
    settle_timeout_s: 2.0
    icc_corners: 4
    delta_offset_v: 0.6
    delta_vcc_min: 3.0
    voh_vol_settle_s: 1.0
    search:
      status: PROPOSED_FROM_LIVE
      vih: {arm: 0.0, direction: up, no_reverse_in_stage: true}
      vil: {arm: VCC, direction: down, no_reverse_in_stage: true}
      step_ladder_V: [0.5, 0.2, 0.1, 0.05, 0.01]
      step_select: "largest step compatible with card |limit|"
      on_hit: {skip_rest_of_walk: true, rearm: true, restart_fraction_back: 0.3, next_smaller_step: true}
      after_precision: {interpolate: true, skip_to: next_test_or_vcc}
      coverage_order: [input_threshold, icc, ii, voh, vol, delta_icc]
  enabled_tests_model: [input_threshold, icc, ii, voh, vol, delta_icc]
  gaps:
    - "UNCONFIRMED until JH CONFIRM"
    - "IOZ OFF (no OE)"
    - "stable_eps_A null"
    - "excel_plots omitted -- keep sheet_map paste.values"
    - "VIH/VIL 9.1 Recommended Operating Conditions is a PDF table image (not in extract) -- leave unset"
    - "VOH first-row IOH current glyph-missing in extract -- not copied as 100uA"
    - "IOH -24mA VCC glyph-missing in extract -- row omitted"
    - "Ariff voh_table/vol_table campaign kept; do not copy extract 9.2 over Ariff"
