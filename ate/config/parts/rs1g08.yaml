voh_vol_settle_s: 1.0
voh_table:
  - {vcc: 2.0, vref: 0.080, spec_min: 1.6, ioh_a: 0.008}
  - {vcc: 3.3, vref: 0.240, spec_min: 2.5, ioh_a: 0.024}
  - {vcc: 4.5, vref: 0.320, spec_min: 3.8, ioh_a: 0.032}
  - {vcc: 5.0, vref: 0.320, spec_min: 4.2, ioh_a: 0.032}
