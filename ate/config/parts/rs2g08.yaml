# RS2G08 dual AND-2 -- UNCONFIRMED Path B bind. Numbers HOLD. No Datasheet CONFIRM.
# CHA then CHB Continue. JH DM unlock != Datasheet CONFIRM. SOOT DRAFT.

part: RS2G08
model: RS2G08
component: Logic
package: VSSOP8
version: Version_1
sample_size: 4
year: "2026"
part_key: rs2g08
product_class: logic
vcc: 5.0
current_limit: 0.05
timing:
  timeout_s: 4.0
  settle_s: 0.3
enabled_tests:
  - tp
  - supply_current
  - input_threshold
  - icc
  - ii
fixture_modes:
  LOGIC:
    label: "Logic board (RS2G08 dual AND)"
    board_class: general
    checklist:
      - "RS2G08 dual AND. UNCONFIRMED DRAFT. CHA then CHB Continue."
      - "oe none. Do not invent IOZ. Unsigned VIH/VIL/VOH/VOL HOLD. Pin numbers HOLD."
      - "Do not tick voh/vol until CONFIRMED loads. ICCT ABSENT."
    tests: [tp, supply_current, input_threshold, icc, ii]

product_model:
  part: RS2G08
  status: UNCONFIRMED
  source_card: ON_DISK_DRAFT
  confirm_note: "SOOT: JH DM unlock != Datasheet CONFIRM. Stay UNCONFIRMED DRAFT. CHA then CHB. Numbers HOLD."
  package: VSSOP8
  product_class: dual_and2
  schmitt: false
  oe: none
  output_pin: Y
  output_type: push_pull
  logic_inputs:
  - A
  - B
  pins:
  - {name: A, role: input}
  - {name: B, role: input}
  - {name: GND, role: gnd}
  - {name: Y, role: output}
  - {name: VCC, role: vcc}
  pin_drive:
    A: {src: awg, ch: 1}
    B: {src: awg, ch: 2}
  truth_table:
    status: UNCONFIRMED
    kind: combinational
    note: AND Y=A AND B per channel. Pin numbers HOLD. Not Datasheet-signed.
    rows:
    - {A: H, B: H, Y: H}
    - {A: L, B: H, Y: L}
    - {A: H, B: L, Y: L}
    - {A: L, B: L, Y: L}
  isolation:
    status: UNCONFIRMED
    note: AND other=H -> track. CHA then CHB.
    tests:
      A:
      - {sweep_pin: A, fix: {B: H}, y_expect: track}
      B:
      - {sweep_pin: B, fix: {A: H}, y_expect: track}
  vcc_grid:
    status: UNCONFIRMED
    stimulus: AWG
    note: No card VIH/VIL bands. Do not copy G08 CMOS bands. Numbers HOLD.
    ranges: []
    fixed_points: []
  pass_mode:
    icc: max_only
    voh: min_only
    vol: max_only
  dc_limits:
    VOH:
      status: UNCONFIRMED
      note: do not invent loads
    VOL:
      status: UNCONFIRMED
      note: do not invent loads
    ICCT_uA:
      status: ABSENT
      note: do not invent ICCT
    delta_icc_uA:
      status: UNCONFIRMED
      note: Numbers HOLD. delta_icc from this block only; ICCT ABSENT is not a map
  recipe:
    settle_s: 0.05
    stable_n: 3
    stable_eps_V: 0.005
    stable_eps_A: null
    settle_timeout_s: 2.0
    runner: dual_and2
    dual_channel_continue: true
    channels: [CHA, CHB]
  gaps:
  - UNCONFIRMED DRAFT; unsigned vcc_grid / VOH / VOL / delta_icc HOLD
  - dual AND; CHA then CHB Continue; oe none; IOZ OFF
  - pin numbers HOLD -- do not invent 8-pin map
  - ICCT ABSENT -- do not invent ICCT map; delta_icc_uA only
  - do not invent VOH/VOL / ICCT / VIH/VIL
  - stable_eps_A null
  data_paths:
    excel: "#Test_Database/{Component}/{Part}/{Package}/{Operator}/{Version_N}/workbook/"
    report: sessions/report.json
    datalog: sessions/datalog.md
    csv: sessions/csv/
    report_pdf: report.pdf
    records: "{test}/DUT_n/records/"
    attach: "{test}/DUT_n/"
  workbook_policy:
    golden_auto: one_per_version_overwrite
    auto: one_per_version_overwrite
    ultimate_manual: never_auto_write
    pretty: never_auto_write
  excel_plots:
    status: UNCONFIRMED
    series:
      - vih_vs_vcc
      - vil_vs_vcc
      - icc_vs_vcc
      - ii_vs_vcc
