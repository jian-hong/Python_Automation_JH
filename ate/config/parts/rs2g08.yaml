# RS2G08 dual AND-2 -- JH DEMO DAY 2026-09-21. SoT CONFIRMED (attached product_model).
# CHA then CHB Continue. Path B logic_inputs A,B (ICC 2^2). Operator 8-pin wire_map. ICCT ABSENT.

part: RS2G08
model: RS2G08
component: Logic
package: VSSOP8
version: Version_1
sample_size: 4
year: "2026"
part_key: rs2g08
product_class: logic
vcc: 5.0
current_limit: 0.05
timing:
  timeout_s: 4.0
  settle_s: 0.3
enabled_tests:
  - tp
  - supply_current
  - input_threshold
  - icc
  - ii
  - voh
  - vol
  - delta_icc
fixture_modes:
  LOGIC:
    label: "Logic board (RS2G08 dual AND)"
    board_class: general
    checklist:
      - "RS2G08 dual AND. CONFIRMED SoT 2026-09-21. CHA then CHB Continue. Do not skip rewire."
      - "oe none. Do not invent IOZ. Signed CMOS VIH/VIL/VOH/VOL/delta_icc. ICCT ABSENT."
      - "Operator wire 8-pin SoT (1A/1B/1Y CHA, 2A/2B/2Y CHB). Path B A/B per channel."
    tests: [tp, supply_current, input_threshold, icc, ii, voh, vol, delta_icc]

product_model:
  part: RS2G08
  status: CONFIRMED
  source_card: RS2G08_card_CONFIRMED.md
  confirm_note: "JH DEMO DAY 2026-09-21. Attached SoT CONFIRMED. CHA then CHB. Path B A/B (not 1A/1B pins). Signed vcc_grid / VOH / VOL / delta_icc_uA. excel_plots CONFIRMED. ICCT name ABSENT."
  package: VSSOP8
  packages_note: "SoT package MSOP8; campaign package stays VSSOP8 -- do not merge SKUs"
  product_class: dual_and2
  schmitt: false
  oe: none
  output_pin: Y
  output_type: push_pull
  vcc_op_min: 1.65
  vcc_op_max: 5.5
  logic_inputs:
  - A
  - B
  pins:
  - {name: A, role: input}
  - {name: B, role: input}
  - {name: GND, role: gnd}
  - {name: Y, role: output}
  - {name: VCC, role: vcc}
  pin_drive:
    A: {src: awg, ch: 1}
    B: {src: awg, ch: 2}
  truth_table:
    status: CONFIRMED
    kind: combinational
    note: AND Y=A AND B per channel. Path B A/B. Operator 8-pin CHA/CHB on LIVE_MATRIX.
    rows:
    - {A: H, B: H, Y: H}
    - {A: L, B: H, Y: L}
    - {A: H, B: L, Y: L}
    - {A: L, B: L, Y: L}
  isolation:
    status: CONFIRMED
    note: AND other=H -> track. CHA then CHB.
    tests:
      A:
      - {sweep_pin: A, fix: {B: H}, y_expect: track}
      B:
      - {sweep_pin: B, fix: {A: H}, y_expect: track}
  vcc_grid:
    status: CONFIRMED
    stimulus: PSU_MSO
    note: SoT CMOS bands (this SKU).
    ranges:
    - {start: 1.65, stop: 1.95, step: 0.1, VIH_min: 0.65*VCC, VIL_max: 0.15*VCC, label: 1.65-1.95}
    - {start: 2.3, stop: 2.7, step: 0.1, VIH_min_V: 1.7, VIL_max_V: 0.3, label: 2.3-2.7}
    - {start: 3.0, stop: 3.6, step: 0.1, VIH_min_V: 2.2, VIL_max_V: 0.4, label: 3-3.6}
    - {start: 4.5, stop: 5.5, step: 0.1, VIH_min: 0.7*VCC, VIL_max: 0.15*VCC, label: 4.5-5.5}
    fixed_points: []
  pass_mode:
    VIH: min_only
    VIL: max_only
    voh: min_only
    vol: max_only
    icc: max_only
    delta_icc: max_only
    ii: max_only
  dc_limits:
    VOH:
      status: CONFIRMED
      loads:
      - {IOH_mA: -0.1, vcc: [1.65, 5.5], VOH_min: VCC-0.1}
      - {IOH_mA: -4, vcc: 1.65, VOH_min_V: 1.2}
      - {IOH_mA: -8, vcc: 2.3, VOH_min_V: 1.9}
      - {IOH_mA: -16, vcc: 3.0, VOH_min_V: 2.4}
      - {IOH_mA: -24, vcc: 3.0, VOH_min_V: 2.3}
      - {IOH_mA: -32, vcc: 4.5, VOH_min_V: 3.8}
    VOL:
      status: CONFIRMED
      loads:
      - {IOL_mA: 0.1, vcc: [1.65, 5.5], VOL_max_V: 0.1}
      - {IOL_mA: 4, vcc: 1.65, VOL_max_V: 0.45}
      - {IOL_mA: 8, vcc: 2.3, VOL_max_V: 0.3}
      - {IOL_mA: 16, vcc: 3.0, VOL_max_V: 0.4}
      - {IOL_mA: 24, vcc: 3.0, VOL_max_V: 0.55}
      - {IOL_mA: 32, vcc: 4.5, VOL_max_V: 0.55}
    II_uA: {Full: 5.0, note: "applies to each of 1A/1B/2A/2B (operator); Path B A/B per channel"}
    ICC_uA: {Full: 10.0}
    ICCT_uA:
      status: ABSENT
      note: ICCT name ABSENT -- do not invent offset_v / one_input_V
    delta_icc_uA:
      status: CONFIRMED
      Full: 500.0
      vcc_min: 3.0
      offset_v: 0.6
      map_to: delta_icc
      datasheet_symbol: "ΔICC"
      ICCT_name: ABSENT
  recipe:
    settle_s: 0.05
    stable_n: 3
    stable_eps_V: 0.005
    stable_eps_A: null
    settle_timeout_s: 2.0
    runner: dual_and2
    dual_channel_continue: true
    continue_switch: true
    unused_channel_hold: VCC_or_GND
    channels: [CHA, CHB]
    search:
      status: PROPOSED_FROM_LIVE
      vih: {arm: 0.0, direction: up, no_reverse_in_stage: true}
      vil: {arm: VCC, direction: down, no_reverse_in_stage: true}
      step_ladder_V: [0.5, 0.2, 0.1, 0.05, 0.01]
      on_hit: {skip_rest_of_walk: true, rearm: true, restart_fraction_back: 0.3, next_smaller_step: true}
      coverage_order: [input_threshold, icc, ii, voh, vol, delta_icc]
  enabled_tests_model: [input_threshold, icc, ii, voh, vol, delta_icc]
  gaps:
  - CONFIRMED SoT 2026-09-21 signed vcc_grid / VOH / VOL / delta_icc_uA; excel_plots CONFIRMED
  - dual AND; CHA then CHB Continue; oe none; IOZ OFF
  - Path B logic_inputs A,B (ICC 2^2). Operator 8-pin: 1=1A 2=1B 3=2Y 4=GND 5=2A 6=2B 7=1Y 8=VCC
  - ICCT ABSENT -- DeltaICC via delta_icc_uA.offset_v 0.6 only
  - UNSURE remain fail-closed: stable_eps_A
  data_paths:
    excel: "#Test_Database/{Component}/{Part}/{Package}/{Operator}/{Version_N}/workbook/"
    report: sessions/report.json
    datalog: sessions/datalog.md
    csv: sessions/csv/
    report_pdf: report.pdf
    records: "{test}/DUT_n/records/"
    attach: "{test}/DUT_n/"
  workbook_policy:
    golden_auto: one_per_version_overwrite
    auto: one_per_version_overwrite
    ultimate_manual: never_auto_write
    pretty: never_auto_write
  excel_plots:
    status: CONFIRMED
    series:
      - vih_vs_vcc
      - vil_vs_vcc
      - icc_vs_vcc
      - ii_vs_vcc
      - voh_at_ioh
      - vol_at_iol
      - delta_icc_vs_vcc
