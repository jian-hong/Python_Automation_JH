# RS1G04 inverter -- JH DEMO DAY 2026-09-21. SoT CONFIRMED (attached product_model).
# n=1 Y=NOT A. NC is not OE. TTL-style bands. Signed loads. ICCT name ABSENT.

part: RS1G04
model: RS1G04
component: Logic
package: SOT23
version: Version_1
sample_size: 4
year: "2026"
part_key: rs1g04
product_class: logic
vcc: 5.0
current_limit: 0.05
timing:
  timeout_s: 4.0
  settle_s: 0.3
enabled_tests:
  - tp
  - supply_current
  - input_threshold
  - icc
  - ii
  - voh
  - vol
  - delta_icc
fixture_modes:
  LOGIC:
    label: "Logic board (RS1G04 INV)"
    board_class: general
    checklist:
      - "RS1G04 inverter. CONFIRMED SoT 2026-09-21. TTL-style VIH/VIL. Signed VOH/VOL/delta_icc."
      - "NC is not OE. Do not tick IOZ. ICCT ABSENT -- delta_icc from delta_icc_uA.offset_v 0.6."
      - "Do not invent ICCT name / OE / IOZ. PSU CH2 Y-load for VOH/VOL."
    tests: [tp, supply_current, input_threshold, icc, ii, voh, vol, delta_icc]

product_model:
  part: RS1G04
  status: CONFIRMED
  source_card: RS1G04_card_CONFIRMED.md
  confirm_note: "JH DEMO DAY 2026-09-21. Attached SoT CONFIRMED. NC not OE. TTL-style bands. Signed VOH/VOL/delta_icc_uA. excel_plots CONFIRMED. ICCT name ABSENT."
  package: SC70-5
  packages_note: SOT23-5 / SC70-5 -- do not merge SKUs; campaign package stays SOT23
  product_class: gate_inv
  schmitt: false
  oe: none
  output_pin: Y
  output_type: push_pull
  vcc_op_min: 1.65
  vcc_op_max: 5.5
  logic_inputs:
  - A
  pins:
  - {name: NC, role: nc, number: 1, note: "N.C. != OE -- do not invent IOZ"}
  - {name: A, role: input, number: 2}
  - {name: GND, role: gnd, number: 3}
  - {name: Y, role: output, number: 4}
  - {name: VCC, role: vcc, number: 5}
  pin_drive:
    A: {src: awg, ch: 1}
  truth_table:
    status: CONFIRMED
    kind: combinational
    note: Y=NOT A. Function CONFIRMED from SoT model.
    rows:
    - {A: H, Y: L}
    - {A: L, Y: H}
  isolation:
    status: CONFIRMED
    tests:
      A:
      - {sweep_pin: A, fix: {}, y_expect: invert}
  vcc_grid:
    status: CONFIRMED
    stimulus: PSU_MSO
    kind: TTL
    note: TTL-style bands as printed -- do NOT substitute RS1G08 CMOS table
    ranges:
    - {start: 1.65, stop: 1.95, step: 0.1, VIH_min: 0.65*VCC, VIL_max: 0.35*VCC, label: 1.65-1.95}
    - {start: 2.3, stop: 2.7, step: 0.1, VIH_min_V: 1.7, VIL_max_V: 0.7, label: 2.3-2.7}
    - {start: 3.0, stop: 3.6, step: 0.1, VIH_min_V: 2.0, VIL_max_V: 0.8, label: 3-3.6}
    - {start: 4.5, stop: 5.5, step: 0.1, VIH_min: 0.7*VCC, VIL_max: 0.3*VCC, label: 4.5-5.5}
    fixed_points: []
  pass_mode:
    VIH: min_only
    VIL: max_only
    voh: min_only
    vol: max_only
    icc: max_only
    delta_icc: max_only
    ii: max_only
  dc_limits:
    VOH:
      status: CONFIRMED
      loads:
      - {IOH_mA: -0.1, vcc: [1.65, 5.5], VOH_min: VCC-0.1}
      - {IOH_mA: -4, vcc: 1.65, VOH_min_V: 1.2}
      - {IOH_mA: -8, vcc: 2.3, VOH_min_V: 1.9}
      - {IOH_mA: -16, vcc: 3.0, VOH_min_V: 2.4}
      - {IOH_mA: -24, vcc: 3.0, VOH_min_V: 2.3}
      - {IOH_mA: -32, vcc: 4.5, VOH_min_V: 3.8}
    VOL:
      status: CONFIRMED
      loads:
      - {IOL_mA: 0.1, vcc: [1.65, 5.5], VOL_max_V: 0.1}
      - {IOL_mA: 4, vcc: 1.65, VOL_max_V: 0.45}
      - {IOL_mA: 8, vcc: 2.3, VOL_max_V: 0.3}
      - {IOL_mA: 16, vcc: 3.0, VOL_max_V: 0.4}
      - {IOL_mA: 24, vcc: 3.0, VOL_max_V: 0.55}
      - {IOL_mA: 32, vcc: 4.5, VOL_max_V: 0.55}
    II_uA: {Full: 5.0}
    ICC_uA: {Full: 10.0}
    ICCT_uA:
      status: ABSENT
      note: ICCT name ABSENT -- do not invent offset_v / one_input_V
    delta_icc_uA:
      status: CONFIRMED
      Full: 500.0
      vcc_min: 3.0
      offset_v: 0.6
      map_to: delta_icc
      datasheet_symbol: DeltaICC
      ICCT_name: ABSENT
  recipe:
    settle_s: 0.05
    stable_n: 3
    stable_eps_V: 0.005
    stable_eps_A: null
    settle_timeout_s: 2.0
    icc_corners: 2
    runner: gate_inv
    dual_channel_continue: false
    search:
      status: PROPOSED_FROM_LIVE
      vih: {arm: 0.0, direction: up, no_reverse_in_stage: true}
      vil: {arm: VCC, direction: down, no_reverse_in_stage: true}
      step_ladder_V: [0.5, 0.2, 0.1, 0.05, 0.01]
      on_hit: {skip_rest_of_walk: true, rearm: true, restart_fraction_back: 0.3, next_smaller_step: true}
      coverage_order: [input_threshold, icc, ii, voh, vol, delta_icc]
  enabled_tests_model: [input_threshold, icc, ii, voh, vol, delta_icc]
  gaps:
  - CONFIRMED SoT 2026-09-21 signed TTL vcc_grid / VOH / VOL / delta_icc_uA; excel_plots CONFIRMED
  - inverter n=1 Y=NOT A; NC not OE; IOZ OFF
  - ICCT ABSENT -- DeltaICC via delta_icc_uA.offset_v 0.6 only
  - UNSURE remain fail-closed: stable_eps_A, retention MAX, VO MAX=5.5 intent
  data_paths:
    excel: "#Test_Database/{Component}/{Part}/{Package}/{Operator}/{Version_N}/workbook/"
    report: sessions/report.json
    datalog: sessions/datalog.md
    csv: sessions/csv/
    report_pdf: report.pdf
    records: "{test}/DUT_n/records/"
    attach: "{test}/DUT_n/"
  workbook_policy:
    golden_auto: one_per_version_overwrite
    auto: one_per_version_overwrite
    ultimate_manual: never_auto_write
    pretty: never_auto_write
  excel_plots:
    status: CONFIRMED
    series:
      - vih_vs_vcc
      - vil_vs_vcc
      - icc_vs_vcc
      - ii_vs_vcc
      - voh_at_ioh
      - vol_at_iol
      - delta_icc_vs_vcc
